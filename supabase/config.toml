# Configuração do Supabase CLI para desenvolvimento local.
# Requer Docker instalado: `supabase start` sobe o stack completo.
project_id = "praxis-mentis-crm"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

# Serviços não usados na Fase 1 ficam desligados para acelerar o start local.
# Reativar conforme as fases avançarem (Realtime na F2, Storage na F4, etc.).
[studio]
enabled = false
port = 54323

[realtime]
enabled = true

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/redefinir-senha"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local: sem confirmação de e-mail para permitir o fluxo de convite sem SMTP.
# Em homologação/produção, ativar confirmações e configurar SMTP.
enable_confirmations = false

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150
